<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Arabic Google Fonts: Cairo, Tajawal, Noto Sans Arabic, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />

    <!-- Primary Meta Tags -->
    <title>Daftrk — دفترك | Cloud Business Management Platform</title>
    <meta name="title" content="Daftrk — دفترك | Cloud Business Management Platform" />
    <meta name="description" content="Daftrk is a modern cloud platform that helps businesses manage customers, products, and professional invoices. Bilingual (Arabic/English), multi-tenant, and beautifully designed." />
    <meta name="keywords" content="Daftrk, دفترك, invoice management, business management, SaaS, CRM, billing, Arabic invoicing, RTL, cloud platform, small business, freelancer, agency" />
    <meta name="author" content="Daftrk" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://daftrk.com/" />
    <meta property="og:title" content="دفترك | Daftrk ERP - نظام إدارة الأعمال السحابي" />
    <meta property="og:description" content="نظام دفترك المتكامل لإدارة المبيعات، الحسابات، والفواتير الإلكترونية." />
    <meta property="og:site_name" content="Daftrk ERP" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_AR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daftrk — دفترك | Cloud Business Management Platform" />
    <meta name="twitter:description" content="Modern cloud platform to manage customers, products, and professional invoices. Bilingual, multi-tenant, and beautifully designed." />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Daftrk",
      "alternateName": "دفترك",
      "description": "Modern cloud platform that helps businesses manage customers, products, and professional invoices.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "10000"
      }
    }
    </script>
    <meta property="og:image" content="https://daftrk.com/og-image.png">
    <meta name="twitter:image" content="https://daftrk.com/og-image.png">
</head>

    <div id="root"></div>
